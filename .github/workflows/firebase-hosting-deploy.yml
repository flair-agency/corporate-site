name: Deploy to Firebase Hosting (OIDC)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

env:
  SITE_ENV: production

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and normalize note article data
        env:
          NOTE_RSS_URL: ${{ vars.NOTE_RSS_URL }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y xsltproc
          curl --fail --silent --show-error --location --max-time 30 --retry 2 "${NOTE_RSS_URL}" |
          xsltproc ./rss-to-tsv.xsl - |
          jq -R 'select(length > 0)|split("\t")|{title:.[0],url:.[1],publishedAt:.[2],description:.[3],thumbnail:.[4]}' |
          jq -s -cS '.' > "${RUNNER_TEMP}/note-articles.json"
          jq -e 'type == "array" and length > 0 and all(.[];
            (.title | type == "string" and length > 0) and
            (.url | type == "string" and startswith("https://note.com/")) and
            (.publishedAt | type == "string" and length > 0) and
            (.description | type == "string") and
            (.thumbnail | type == "string" and (length == 0 or startswith("https://"))))' \
            "${RUNNER_TEMP}/note-articles.json" > /dev/null
      - name: Restore the hash from a successful deployment
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            try {
              const repo = { owner: context.repo.owner, repo: context.repo.repo };
              const current = await github.rest.actions.getWorkflowRun({ ...repo, run_id: context.runId });
              const { data } = await github.rest.actions.listArtifactsForRepo({
                ...repo, name: 'deployed-note-hash', per_page: 100,
              });
              const candidates = data.artifacts.filter(a => !a.expired)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              for (const artifact of candidates) {
                if (!artifact.workflow_run) continue;
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  ...repo, run_id: artifact.workflow_run.id,
                });
                if (run.workflow_id !== current.data.workflow_id || run.conclusion !== 'success') continue;
                const archive = await github.rest.actions.downloadArtifact({
                  ...repo, artifact_id: artifact.id, archive_format: 'zip',
                });
                fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'deployed-note-hash.zip'), Buffer.from(archive.data));
                break;
              }
            } catch {
              core.warning('Comparison hash unavailable; this run will use CI and deployment.');
            }
      - name: Compare article hashes
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CURRENT_HASH=$(sha256sum "${RUNNER_TEMP}/note-articles.json" | cut -d ' ' -f 1)
          PUBLISHED_HASH=''
          if [[ -f "${RUNNER_TEMP}/deployed-note-hash.zip" ]]; then
            PUBLISHED_HASH=$(unzip -p "${RUNNER_TEMP}/deployed-note-hash.zip" note-articles.sha256 2>/dev/null || true)
          fi
          # Missing, expired or invalid baselines trigger CI instead of suppressing an update.
          if [[ "${EVENT_NAME}" == "schedule" && "${PUBLISHED_HASH}" =~ ^[0-9a-f]{64}$ && "${CURRENT_HASH}" == "${PUBLISHED_HASH}" ]]; then
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "Article JSON is unchanged; skipping build, preview, CI, and deployment."
          else
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.compare.outputs.should_deploy == 'true'
        with:
          name: note-articles
          path: ${{ runner.temp }}/note-articles.json
          if-no-files-found: error
          retention-days: 7

  setup:
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.preview.outputs.origin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"

      - uses: actions/download-artifact@v4
        with:
          name: note-articles
          path: src/_data

      - name: Install
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-firebase-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - id: preview
        name: Deploy to a short-lived preview channel
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx firebase hosting:channel:deploy "${GITHUB_RUN_ID}" -e 1h --project "${PROJECT_ID}" --json |
          jq -er --arg pid "${PROJECT_ID}" '.result[$pid].url | select(. != null and . != "") | "origin=\(.)"' >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        page: [home, creator, business, company, articles]
    env:
      REPORTS_PATH: /tmp/lighthouse-reports
      FIREBASE_PID_FILE: /tmp/firebase-emulator.pid
      ORIGIN: ${{ needs.setup.outputs.origin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"

      - name: Install
        run: npm ci

      - name: Test
        env:
          PAGE: ${{ matrix.page }}
        run: |
          set -euo pipefail
          mkdir -p "${REPORTS_PATH}"
          REPORT_FILE="${REPORTS_PATH}/${PAGE}.json"

          npm -s run test:lighthouse "${ORIGIN}/${PAGE}/" -- --quiet --output-path="${REPORT_FILE}" --throttling-method=provided --skip-audits="is-crawlable,robots-txt"

          npm -s run test:lighthouse-gate < "${REPORT_FILE}" | while IFS=$'\t' read -r METRIC SCORE RESULT
          do
            case "${RESULT:-}" in
            FAIL)
              echo "::error::Lighthouse gate ${METRIC} failed! (Score: ${SCORE})"
              ;;
            PASS)
              echo "::info::Lighthouse gate ${METRIC} passed. (Score: ${SCORE})"
              ;;
            *)
              ;;
            esac
          done
          exit "${PIPESTATUS[0]}"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports (${{ matrix.page }})
          path: ${{ env.REPORTS_PATH }}/${{ matrix.page }}.json

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"

      - uses: actions/download-artifact@v4
        with:
          name: note-articles
          path: src/_data

      - name: Install
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-firebase-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Deploy to Firebase Hosting
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: npx firebase deploy --only hosting --project "${PROJECT_ID}"

      - name: Record the successfully deployed article hash
        run: |
          set -euo pipefail
          sha256sum src/_data/note_articles.json | cut -d ' ' -f 1 > "${RUNNER_TEMP}/note-articles.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-note-hash
          path: ${{ runner.temp }}/note-articles.sha256
          if-no-files-found: error
          retention-days: 90
